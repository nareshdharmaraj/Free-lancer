<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | TasteIT</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            text-align: center;
            padding: var(--spacing-2xl);
        }

        .error-content {
            max-width: 600px;
        }

        .error-code {
            font-size: 10rem;
            font-weight: 900;
            line-height: 1;
            margin-bottom: var(--spacing-lg);
            text-shadow: 4px 4px 20px rgba(0, 0, 0, 0.3);
            animation: bounce 2s infinite;
        }

        .error-icon {
            font-size: 5rem;
            margin-bottom: var(--spacing-xl);
            animation: shake 3s infinite;
        }

        @keyframes shake {

            0%,
            100% {
                transform: rotate(0deg);
            }

            10%,
            30%,
            50%,
            70%,
            90% {
                transform: rotate(-5deg);
            }

            20%,
            40%,
            60%,
            80% {
                transform: rotate(5deg);
            }
        }

        @keyframes bounce {

            0%,
            20%,
            50%,
            80%,
            100% {
                transform: translateY(0);
            }

            40% {
                transform: translateY(-20px);
            }

            60% {
                transform: translateY(-10px);
            }
        }
    </style>
</head>

<body>
    <div class="error-container">
        <div class="error-content">
            <div class="error-icon">
                <i class="fas fa-utensils"></i>
            </div>
            <div class="error-code">404</div>
            <h1 style="font-size: 2.5rem; margin-bottom: var(--spacing-lg);">Oops! Page Not Found</h1>
            <p style="font-size: 1.2rem; margin-bottom: var(--spacing-2xl); opacity: 0.9;">
                Looks like this dish isn't on our menu! The page you're looking for doesn't exist.
            </p>
            <div style="display: flex; gap: var(--spacing-md); justify-content: center; flex-wrap: wrap;">
                <a href="index.html" class="btn btn-lg" style="background: white; color: var(--primary-color);">
                    <i class="fas fa-home"></i> Go Home
                </a>
                <a href="menu.html" class="btn btn-outline btn-lg" style="border-color: white; color: white;">
                    <i class="fas fa-book-open"></i> View Menu
                </a>
            </div>
        </div>
    </div>
</body>

</html>
