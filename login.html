<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BuildWith</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        .login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: url('https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&q=80&w=1920') no-repeat center center/cover;
            position: relative;
            padding-top: 80px;
            padding-bottom: 20px;
            overflow: hidden;
        }

        .login-wrapper::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            /* Dark overlay */
            z-index: 0;
        }

        body {
            overflow: hidden;
        }

        /* Top Navigation for Login Page */
        .login-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 0;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .login-nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .login-nav-controls {
            display: flex;
            gap: 0.8rem;
            align-items: center;
        }

        .login-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            padding: 2.5rem;
            text-align: center;
            margin: 0 1rem;
        }

        .login-card::-webkit-scrollbar {
            width: 6px;
        }

        .login-card::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .login-card::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            .login-wrapper {
                padding-top: 80px;
                padding-bottom: 10px;
            }

            .login-card {
                padding: 1.5rem 1.2rem;
                max-width: 95%;
                max-height: calc(100vh - 90px);
            }

            .login-card > div:first-child {
                margin-bottom: 1.2rem !important;
            }

            .login-card h2 {
                font-size: 1.6rem !important;
            }

            .input-group {
                margin-bottom: 1rem;
            }

            .divider {
                margin: 1rem 0;
            }
            
            .login-nav-controls {
                gap: 0.5rem;
            }
            
            .login-nav-controls .cta-btn {
                padding: 0.4rem 1rem !important;
                font-size: 0.85rem !important;
            }

            .login-nav {
                padding: 0.8rem 0;
            }
        }

        @media (max-height: 700px) {
            .login-card {
                padding: 1.5rem 2rem;
            }

            .login-card > div:first-child {
                margin-bottom: 1rem !important;
            }

            .input-group {
                margin-bottom: 1rem;
            }

            .divider {
                margin: 1rem 0;
            }
        }

        .input-group {
            position: relative;
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .input-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            outline: none;
            transition: all 0.3s;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
        }

        .divider {
            margin: 1.2rem 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .divider span {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--background-dark);
            /* Fallback if needed, but glass handles it */
            background: #1e293b;
            padding: 0 10px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .social-login {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .social-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .social-btn:hover {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }
    </style>
</head>

<body>

    <!-- Top Navigation -->
    <nav class="login-nav">
        <div class="container">
            <div class="logo">
                <a href="index.html" style="display: flex; align-items: center; gap: 0.5rem;">
                    <i class="fas fa-hard-hat" style="font-size: 1.8rem; color: var(--primary-color);"></i>
                    <h2
                        style="background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; margin: 0;">
                        BuildWith</h2>
                </a>
            </div>

            <div class="login-nav-controls">
                <button id="rtl-toggle" class="icon-btn" title="Toggle RTL"><i class="fas fa-globe"></i></button>
                <button id="theme-toggle" class="icon-btn" title="Toggle Theme"><i class="fas fa-moon"></i></button>
                <a href="index.html" class="cta-btn" style="padding: 0.5rem 1.5rem; font-size: 0.9rem;">
                    <i class="fas fa-home"></i> Home
                </a>
            </div>
        </div>
    </nav>

    <!-- Login Wrapper -->
    <div class="login-wrapper">
        <!-- Particles Canvas (from script) -->

        <div class="login-card glass animate-fade-up">
            <div style="margin-bottom: 2rem;">
                <div style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 0.5rem;">
                    <i class="fas fa-hard-hat" style="font-size: 1.8rem; color: var(--primary-color);"></i>
                    <h2 style="font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin: 0;">BuildWith</h2>
                </div>
                <p style="color: var(--text-muted);">Access your project dashboard</p>
            </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" placeholder="name@company.com" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="••••••••" required>
            </div>

            <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem; font-size: 0.85rem;">
                <label style="display: flex; gap: 0.5rem; cursor: pointer; color: var(--text-muted);">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" style="color: var(--primary-color);">Forgot Password?</a>
            </div>

            <button type="submit" class="cta-btn" style="width: 100%; border-radius: 8px;">Sign In</button>
        </form>

        <div class="divider"><span>OR CONTINUE WITH</span></div>

        <div class="social-login">
            <button class="social-btn"><i class="fab fa-google"></i></button>
            <button class="social-btn"><i class="fab fa-linkedin-in"></i></button>
            <button class="social-btn"><i class="fab fa-github"></i></button>
        </div>

        <p style="margin-top: 2rem; font-size: 0.9rem; color: var(--text-muted);">
            Don't have an account? <a href="#" style="color: var(--primary-color); font-weight: 600;">Contact Sales</a>
        </p>
        </div>
    </div>

    <script src="assets/js/rtl-toggle.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/particles.js"></script>
    <script>
        function handleLogin(e) {
            e.preventDefault();
            // Simple mock login routing
            const email = e.target.querySelector('input[type="email"]').value;
            if (email.includes('admin')) {
                window.location.href = 'admin-dashboard.html';
            } else {
                window.location.href = 'user-dashboard.html';
            }
        }
    </script>
</body>

</html>
